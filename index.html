<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar app-nav">
    <div class="container-xl">
      <span class="navbar-brand mb-0">Power Up! <span class="brand-sub">Learning Portfolio</span></span>
    </div>
  </nav>

  <main class="container-xl py-4">
    <div id="toast-area" class="toast-area" aria-live="polite"></div>

    <div class="row g-4">
      <!-- Sidebar: portfolios -->
      <aside class="col-lg-4">
        <section class="panel">
          <h2 class="panel-title">Portfolios <span class="badge text-bg-secondary" id="portfolio-count">0</span></h2>
          <div id="portfolio-list" class="list-group list-group-flush mb-3"></div>

          <h3 class="h6 mt-3">สร้าง Portfolio ใหม่</h3>
          <form id="portfolio-form" novalidate>
            <div class="mb-2">
              <label class="form-label" for="p-name">ชื่อที่ต้องการแสดง <span class="req">*</span></label>
              <input class="form-control" id="p-name" name="name" type="text" maxlength="60" placeholder="ชื่อจริงหรือชื่อสมมติ">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-2">
              <label class="form-label" for="p-enjoy">What I Enjoy (ชอบทำอะไร) <span class="req">*</span></label>
              <textarea class="form-control" id="p-enjoy" name="enjoy" rows="2"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-2">
              <label class="form-label" for="p-tried">What I've Tried (อะไรที่อยากลองทำ) <span class="req">*</span></label>
              <textarea class="form-control" id="p-tried" name="tried" rows="2"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="p-curious">What I'm Curious About (สนใจ/อยากรู้อะไรเพิ่ม) <span class="req">*</span></label>
              <textarea class="form-control" id="p-curious" name="curious" rows="2"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <button class="btn btn-accent w-100" type="submit">สร้าง Portfolio</button>
          </form>
        </section>
      </aside>

      <!-- Main: selected portfolio -->
      <div class="col-lg-8">
        <section id="empty-state" class="panel text-center py-5" hidden>
          <p class="mb-1 fw-semibold">ยังไม่มี Portfolio</p>
          <p class="text-body-secondary mb-0">สร้าง Portfolio ใหม่ได้จากฟอร์มทางซ้าย</p>
        </section>

        <div id="portfolio-view" hidden>
          <section class="panel mb-4">
            <div class="d-flex justify-content-between align-items-start gap-2 flex-wrap">
              <h2 class="h3 mb-0" id="v-name"></h2>
            </div>
            <dl class="profile mt-3 mb-0">
              <dt>What I Enjoy</dt><dd id="v-enjoy"></dd>
              <dt>What I've Tried</dt><dd id="v-tried"></dd>
              <dt>What I'm Curious About</dt><dd id="v-curious"></dd>
            </dl>
          </section>

          <section class="panel mb-4">
            <h2 class="panel-title">Portfolio Items <span class="badge text-bg-secondary" id="item-count">0</span></h2>
            <div id="item-list" class="row g-3"></div>
          </section>

          <section class="panel">
            <h2 class="panel-title">เพิ่ม Portfolio Item</h2>
            <form id="item-form" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="i-title">Title <span class="req">*</span></label>
                  <input class="form-control" id="i-title" name="title" type="text" maxlength="100">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                  <label class="form-label" for="i-type">Type <span class="req">*</span></label>
                  <select class="form-select" id="i-type" name="type">
                    <option value="">เลือกประเภท</option>
                    <option>Course Assignment</option>
                    <option>Personal Project</option>
                    <option>Club Activity</option>
                    <option>Workshop</option>
                    <option>Volunteer</option>
                    <option>Other</option>
                  </select>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-3">
                  <label class="form-label" for="i-date">Date <span class="req">*</span></label>
                  <input class="form-control" id="i-date" name="date" type="date">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="i-role">Role <span class="req">*</span></label>
                  <input class="form-control" id="i-role" name="role" type="text" maxlength="80">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="i-skills">Skills <span class="req">*</span> <span class="hint">คั่นด้วยเครื่องหมายจุลภาค</span></label>
                  <input class="form-control" id="i-skills" name="skills" type="text" placeholder="HTML, CSS, JavaScript">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="i-description">Description <span class="req">*</span></label>
                  <textarea class="form-control" id="i-description" name="description" rows="2"></textarea>
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-12"><h3 class="h6 mb-0 mt-1">Reflection</h3></div>
                <div class="col-md-6">
                  <label class="form-label" for="i-did">What I did <span class="req">*</span></label>
                  <textarea class="form-control" id="i-did" name="whatIDid" rows="2"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="i-learned">What I learned <span class="req">*</span></label>
                  <textarea class="form-control" id="i-learned" name="whatILearned" rows="2"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="i-challenge">Challenge <span class="req">*</span></label>
                  <textarea class="form-control" id="i-challenge" name="challenge" rows="2"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="i-next">Next step <span class="req">*</span></label>
                  <textarea class="form-control" id="i-next" name="nextStep" rows="2"></textarea>
                  <div class="invalid-feedback"></div>
                </div>

                <div class="col-12">
                  <label class="form-label" for="i-evidence">Evidence <span class="req">*</span> <span class="hint">ลิงก์ละ 1 บรรทัด อย่างน้อย 1 ลิงก์ (ขึ้นต้นด้วย http:// หรือ https://)</span></label>
                  <textarea class="form-control" id="i-evidence" name="evidence" rows="2" placeholder="https://example.com/my-work"></textarea>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                  <button class="btn btn-accent" type="submit">บันทึก Item</button>
                  <button class="btn btn-link" type="reset" id="item-reset">ล้างฟอร์ม</button>
                </div>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="js/samples.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
